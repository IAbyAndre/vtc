<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin - Okyry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white mb-2 uppercase tracking-wide">Administrador</h1>
            <p class="text-slate-400 text-sm">Inicia sesión para gestionar la flota</p>
        </div>
        
        <form onsubmit="handleLogin(event)" class="space-y-6" autocomplete="on">
            <div>
                <label class="block text-slate-400 text-xs font-bold uppercase tracking-wider mb-2" for="username">Usuario / ID</label>
                <select id="username" name="username" required
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors placeholder-slate-700 appearance-none">
                    <option value="" disabled selected>Selecciona tu ID</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                    <option value="13">13</option>
                    <option value="14">14</option>
                    <option value="15">15</option>
                </select>
            </div>
            
            <div>
                <label class="block text-slate-400 text-xs font-bold uppercase tracking-wider mb-2" for="password">Contraseña</label>
                <select id="password" name="password" required
                    class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors placeholder-slate-700 appearance-none">
                    <option value="" disabled selected>Selecciona contraseña</option>
                    <option value="PWD123">PWD123</option>
                </select>
            </div>

            <button type="submit" 
                class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-4 rounded-xl transition-all uppercase tracking-widest text-sm shadow-lg shadow-emerald-500/20">
                Ingresar
            </button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('autofill') === 'true') {
                document.getElementById('username').value = '1';
                document.getElementById('password').value = 'PWD123';
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('password').value;
            
            if (pass !== 'PWD123') {
                alert("Contraseña incorrecta");
                return;
            }
            
            // Set session and redirect
            localStorage.setItem('okyry_admin', JSON.stringify({ user: document.getElementById('username').value, loggedIn: true }));
            window.location.href = '/administrador/etapa1/';
        }
    </script>
</body>
</html>
