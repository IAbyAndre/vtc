<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTC Conductor - Malabo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; }
        .btn-confirm { animation: pulse-green 2s infinite; }
        @keyframes pulse-green {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
    
    <div id="statusCard" class="bg-slate-900 border border-slate-800 rounded-[2rem] p-8 w-full max-w-md shadow-2xl">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-slate-500 font-bold tracking-widest uppercase text-sm">Panel Conductor</h1>
            <div class="flex items-center gap-4">
                <div id="statusDot" class="w-3 h-3 rounded-full bg-slate-700"></div>
                <button onclick="localStorage.removeItem('okyry_driver'); location.href='/conductor/?autofill=true'" class="text-slate-400 hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="text-center mb-10">
            <p class="text-slate-400 text-sm mb-1 uppercase font-bold tracking-tighter">Vehículo #<span id="carId">...</span></p>
            <h2 id="currentStatusText" class="text-3xl font-black text-white">CONECTANDO...</h2>
        </div>

        <div id="standardActions" class="space-y-3">
            <button onclick="updateStatus(1)" class="w-full bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-500 font-black py-5 rounded-2xl transition-all uppercase tracking-widest text-sm border border-emerald-500/20">
                Ponerme Libre
            </button>
            <button onclick="updateStatus(4)" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-400 font-black py-5 rounded-2xl transition-all uppercase tracking-widest text-sm border border-slate-700">
                Desconectar
            </button>
        </div>

        <div id="assignmentActions" class="hidden">
            <div class="bg-emerald-500 p-6 rounded-3xl text-center mb-6 btn-confirm cursor-pointer" onclick="updateStatus(3)">
                <p class="text-emerald-900 font-black text-xs uppercase tracking-widest mb-1">¡NUEVO VIAJE!</p>
                <h3 class="text-white font-black text-2xl">ACEPTAR VIAJE</h3>
                <p class="text-emerald-900/60 font-medium text-[10px] mt-2 italic">Tienes 60 segundos para confirmar</p>
            </div>
            <button onclick="updateStatus(1)" class="w-full bg-slate-800 text-slate-500 font-bold py-4 rounded-2xl uppercase text-xs">Rechazar</button>
        </div>

         <div id="routeActions" class="hidden">
            <button onclick="updateStatus(5)" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl transition-all uppercase tracking-widest text-sm shadow-xl shadow-blue-600/20 active:scale-95 mb-3">
                CLIENTE A BORDO
            </button>
        </div>

        <div id="aboardActions" class="hidden">
            <button onclick="finalizarViaje()" class="w-full bg-violet-600 text-white font-black py-5 rounded-2xl transition-all uppercase tracking-widest text-sm shadow-xl shadow-violet-600/20 active:scale-95">
                FINALIZAR VIAJE
            </button>
        </div>

        <div class="mt-10 pt-8 border-t border-slate-800">
            <p class="text-[10px] text-slate-600 font-bold uppercase tracking-widest mb-4">Simulador GPS</p>
            <div class="grid grid-cols-2 gap-3 mb-4">
                <input type="number" id="latInput" placeholder="Lat" step="0.0001" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm">
                <input type="number" id="lngInput" placeholder="Lng" step="0.0001" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm">
            </div>
            <button onclick="sendPosition()" class="w-full bg-slate-950 text-slate-500 font-bold py-3 rounded-xl text-[10px] uppercase tracking-widest border border-slate-800 hover:text-slate-300 transition-colors">
                Actualizar Posición
            </button>
        </div>
    </div>

    <script>
        const id = new URLSearchParams(window.location.search).get('id');
        if (!id) window.location.href = '/conductor?autofill=true';

        document.getElementById('carId').innerText = id;
        let ws;
        let lastStatus = 0;

        function playNotify() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.5);
            } catch(e) {}
        }

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);
            ws.onmessage = (event) => {
                const d = JSON.parse(event.data);
                const items = d.f ? d.c : d.u;
                const v = items.find(x => x[0] == id);
                if (v) {
                    if (v[3] === 2 && lastStatus !== 2) {
                        playNotify();
                        if ("vibrate" in navigator) navigator.vibrate([200, 100, 200, 100, 500]);
                    }
                    lastStatus = v[3];
                    const textMap = { 1: 'LIBRE', 2: 'ASIGNADO', 3: 'EN RUTA', 4: 'OFFLINE', 5: 'A BORDO' };
                    const dotMap = { 1: 'bg-emerald-500', 2: 'bg-amber-500 animate-pulse', 3: 'bg-blue-500', 4: 'bg-slate-700', 5: 'bg-violet-500' };
                    document.getElementById('currentStatusText').innerText = textMap[v[3]] || '...';
                    document.getElementById('statusDot').className = 'w-3 h-3 rounded-full ' + (dotMap[v[3]] || 'bg-slate-700');
                    document.getElementById('standardActions').className = (v[3] === 1 || v[3] === 4) ? 'space-y-3' : 'hidden';
                    document.getElementById('assignmentActions').className = (v[3] === 2) ? 'block' : 'hidden';
                    document.getElementById('routeActions').className = (v[3] === 3) ? 'block' : 'hidden';
                    document.getElementById('aboardActions').className = (v[3] === 5) ? 'block' : 'hidden';
                    const latIn = document.getElementById('latInput');
                    const lngIn = document.getElementById('lngInput');
                    if (!latIn.value) { latIn.value = v[1]; lngIn.value = v[2]; }
                }
            };
            ws.onclose = () => setTimeout(connect, 2000);
        }

        async function finalizarViaje() {
            if (confirm("¿Estás seguro de que deseas finalizar este viaje?")) {
                await updateStatus(1);
            }
        }

        async function updateStatus(st) {
            try {
                const res = await fetch('/vehiculo/' + id, {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ st })
                });
                if (!res.ok) throw new Error("Error al actualizar");
            } catch (e) {
                alert("Error de conexión: No se pudo actualizar el estado.");
            }
        }

        async function sendPosition() {
            const lat = parseFloat(document.getElementById('latInput').value);
            const lng = parseFloat(document.getElementById('lngInput').value);
            if (isNaN(lat) || isNaN(lng)) return;
            await fetch('/vehiculo/' + id, { method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ lat, lng }) });
        }
        connect();
    </script>
</body>
</html>
