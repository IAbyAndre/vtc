<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okyry - Bienvenido</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 2rem;
        }
        .logo {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 10px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .btn {
            display: block;
            text-decoration: none;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            color: white;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .btn-cliente {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        }
        .btn-conductor {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
        }
        .btn-admin {
            background: linear-gradient(135deg, #607D8B 0%, #455A64 100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Okyry</h1>
        <p style="margin-bottom: 2rem; color: #666;">Selecciona tu perfil de ingreso</p>
        
        <div class="btn-group">
            <a href="/cliente/?autofill=true" class="btn btn-cliente">
                Cliente
            </a>
            <a href="/conductor?autofill=true" class="btn btn-conductor">
                Conductor
            </a>
            <a href="/administrador?autofill=true" class="btn btn-admin">
                Administrador
            </a>
        </div>
    </div>
</body>
</html>
