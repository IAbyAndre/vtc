<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>okyry - Envíos rápidos</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1d1a;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .header {
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .main-card {
            width: 100%;
            max-width: 400px;
            background: #112521;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .image-container {
            width: 100%;
            aspect-ratio: 1/1;
            background: url('https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&q=80&w=800') center/cover;
            border-radius: 20px;
            margin: 15px;
            width: calc(100% - 30px);
        }

        .content {
            padding: 0 20px 20px;
        }

        h1 {
            font-size: 1.75rem;
            margin: 1.5rem 0 0.75rem;
            font-weight: 700;
            line-height: 1.2;
        }

        p {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.5;
            padding: 0 10px;
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 2rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #334155;
        }

        .dot.active {
            width: 24px;
            border-radius: 4px;
            background: #4adeb3;
        }

        .buttons {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.2s;
            gap: 8px;
        }

        .btn-primary {
            background: #4adeb3;
            color: #064e3b;
        }

        .btn-primary:hover {
            background: #3bc7a1;
        }

        .btn-secondary {
            border: 2px solid #334155;
            color: #4adeb3;
        }

        .btn-secondary:hover {
            background: rgba(74, 222, 179, 0.1);
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .scooter-icon {
            fill: #4adeb3;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #112521;
            width: 100%;
            max-width: 360px;
            border-radius: 20px;
            padding: 30px;
            text-align: left;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .modal h2 {
            margin-top: 0;
            color: #4adeb3;
            font-size: 1.5rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0d1d1a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            background: #4adeb3;
            color: #064e3b;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .fake-cursor {
            border-right: 2px solid #4adeb3;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="header">
        <svg class="scooter-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C19.7 10.5 19 9 19 8c0-2.2-1.8-4-4-4h-2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
        <span>okyry</span>
    </div>

    <div class="main-card">
        <div class="image-container"></div>
        <h1>Envíos para todos, en todas partes</h1>
        <p>Desde Malabo hasta Bata, recibe lo que necesitas de forma eficiente y segura.</p>
        <div class="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div class="buttons">
        <a href="javascript:void(0)" onclick="openModal('crear')" class="btn btn-primary">
            Crear cuenta 
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
        <a href="javascript:void(0)" onclick="openModal('login')" class="btn btn-secondary">Iniciar sesión</a>
    </div>

    <div id="authModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Iniciar sesión</h2>
            <div id="registerFields" style="display: none;">
                <div class="input-group">
                    <label>Nombre</label>
                    <input type="text" id="nameInput" placeholder="Ej: Juan">
                </div>
                <div class="input-group">
                    <label>Apellido</label>
                    <input type="text" id="surnameInput" placeholder="Ej: Pérez">
                </div>
            </div>
            <div class="input-group">
                <label>Teléfono o Email</label>
                <input type="text" id="userInput" placeholder="Ej: +240 222 333 444">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="passInput" placeholder="Tu contraseña">
            </div>
            <button class="btn-submit" id="submitBtn">Continuar</button>
        </div>
    </div>

    <div class="footer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color: #4adeb3;"><polyline points="20 6 9 17 4 12"></polyline></svg>
        SEGURO Y LOCAL
    </div>

    <script>
        // Si hay un viaje activo, redirigir directo al seguimiento
        if (localStorage.getItem('okyry_active_trip')) {
            window.location.href = '/cliente/etapa4';
        }

        const modal = document.getElementById('authModal');
        const userInput = document.getElementById('userInput');
        const passInput = document.getElementById('passInput');
        const nameInput = document.getElementById('nameInput');
        const surnameInput = document.getElementById('surnameInput');
        const registerFields = document.getElementById('registerFields');
        const modalTitle = document.getElementById('modalTitle');
        const submitBtn = document.getElementById('submitBtn');

        let clientesDemo = [];
        let currentMode = 'login';

        // Cargar clientes demo
        fetch('/clientes_demo.json')
            .then(res => res.json())
            .then(data => { clientesDemo = data; })
            .catch(err => console.error("Error cargando demos", err));

        function openModal(type) {
            currentMode = type;
            modal.style.display = 'flex';
            modalTitle.innerText = type === 'crear' ? 'Crear cuenta' : 'Iniciar sesión';
            registerFields.style.display = type === 'crear' ? 'block' : 'none';
            userInput.value = "";
            passInput.value = "";
            if (type === 'crear') {
                nameInput.value = "";
                surnameInput.value = "";
                nameInput.focus();
            } else {
                userInput.focus();
            }
        }

        submitBtn.onclick = function() {
            const user = userInput.value.trim();
            const pass = passInput.value.trim();

            if (user.length < 3 || pass.length < 3) {
                alert("Por favor, rellena todos los campos");
                return;
            }
            
            submitBtn.innerText = "Accediendo...";
            submitBtn.disabled = true;

            // Simular validación contra el JSON
            const demoMatch = clientesDemo.find(c => (c.email === user || c.telefono === user) && c.password === pass);
            
            let finalName = "";
            let finalAvatar = "";

            if (demoMatch) {
                finalName = `${demoMatch.nombre} ${demoMatch.apellido.charAt(0).toUpperCase()}.`;
                finalAvatar = demoMatch.avatar;
            } else if (currentMode === 'crear' && nameInput.value && surnameInput.value) {
                finalName = `${nameInput.value.trim()} ${surnameInput.value.trim().charAt(0).toUpperCase()}.`;
                finalAvatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${nameInput.value}`;
            } else {
                const namePart = user.split('@')[0];
                finalName = namePart.charAt(0).toUpperCase() + namePart.slice(1);
                finalAvatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${user}`;
            }

            const userData = {
                nombre: finalName,
                email: demoMatch ? demoMatch.email : user,
                avatar: finalAvatar
            };

            localStorage.setItem('okyry_user', JSON.stringify(userData));
            
            setTimeout(() => {
                window.location.href = "/cliente/etapa1";
            }, 800);
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
